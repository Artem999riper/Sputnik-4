<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛰️ Спутник-Полевик ПК</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- Боковая навигация -->
  <nav id="sidebar">
    <div id="sidebar-logo">
      <span>🛰️</span>
      <div>
        <div>Полевик</div>
        <div class="logo-sub">ПК версия</div>
      </div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-item" data-screen="home" onclick="nav('home')">
        <span class="nav-icon">🏠</span> Главная
      </div>
      <div class="nav-sep"></div>
      <div class="nav-item" data-screen="refs" onclick="nav('refs')">
        <span class="nav-icon">📥</span> Справочники
      </div>
      <div class="nav-item" data-screen="brigade" onclick="nav('brigade')">
        <span class="nav-icon">👥</span> Бригада
      </div>
      <div class="nav-sep"></div>
      <div class="nav-item" data-screen="sites" onclick="nav('sites')">
        <span class="nav-icon">🏗️</span> Объекты
      </div>
      <div class="nav-sep"></div>
      <div class="nav-item" data-screen="export" onclick="nav('export')">
        <span class="nav-icon">📦</span> Экспорт .spk
      </div>
      <div class="nav-item" data-screen="vedomost" onclick="nav('vedomost')">
        <span class="nav-icon">📊</span> Ведомости
      </div>
      <div class="nav-item" data-screen="summary" onclick="nav('summary')">
        <span class="nav-icon">📄</span> Сводка
      </div>
    </div>
    <div id="sidebar-brigade">
      <div class="brg-label">Бригада</div>
      <div id="sidebar-brigade-info" style="color:var(--text3);font-size:11px">не задана</div>
    </div>
  </nav>

  <!-- Основная область -->
  <div id="main-area">
    <header id="topbar">
      <button class="back-btn" onclick="navBack()" title="Назад">←</button>
      <div class="title">
        <span id="page-title">🛰️ Спутник-Полевик</span>
        <span id="page-subtitle"></span>
      </div>
      <div class="actions" id="page-actions"></div>
    </header>
    <main id="screen"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<input type="file" id="hidden-file" style="display:none">

<script src="lib/xlsx.bundle.js"></script>
<script src="js/globals.js"></script>
<script src="js/ui.js"></script>
<script src="js/refs.js"></script>
<script src="js/brigade.js"></script>
<script src="js/sites.js"></script>
<script src="js/volumes.js"></script>
<script src="js/boreholes.js"></script>
<script src="js/task_points.js"></script>
<script src="js/borehole_edit.js"></script>
<script src="js/photos.js"></script>
<script src="js/export.js"></script>
<script src="js/vedomost.js"></script>
<script src="js/summary.js"></script>
<script src="js/home.js"></script>
<script src="js/nav.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    nav('home');
  });
</script>
</body>
</html>
